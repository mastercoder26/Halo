name: macOS artifacts

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run type-check
          npm test
          npm run lint

      - name: Build macOS disk image and zip
        run: npm run package:ci

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: halo-macos-${{ github.sha }}
          path: |
            release/*.dmg
            release/*-mac.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*-mac.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Update nightly download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly macOS build
          prerelease: true
          make_latest: false
          files: |
            release/*.dmg
            release/*-mac.zip
          fail_on_unmatched_files: true
          body: |
            Latest Apple Silicon build from `main` (`${{ github.sha }}`).

            Tagged releases keep their own assets; this nightly pre-release is overwritten on each push to `main`.
